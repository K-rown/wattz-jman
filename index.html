          if (p.t) row.appendChild($('span', 'pick', 'pick up at ' + hms(p.t)));
          if (!p.complete) row.appendChild($('span', 'pick', 'stop at ' + hms(p.end)));
          gd.appendChild(row);
        });
        b.appendChild(gd);
      });
      if (s.note) b.appendChild($('div', 'sm', esc(s.note)));
      if (s.extra) b.appendChild($('div', 'sm', esc(s.extra)));
      b.appendChild($('div', 'quiz', esc(s.quiz)));
      if (s.stop) b.appendChild($('div', 'stop', 'Next Friday starts at ' + esc(s.stop.unit.book + ': ' + s.stop.unit.label) + (s.stop.at ? ' @ ' + hms(s.stop.at) : '')));
    }
    if (s.banner) c.appendChild($('div', 'banner', esc(s.banner)));
    cards.appendChild(c);
  });
  function fullBook(s) { const g = s.groups && s.groups[0]; if (!g) return null; return Object.keys(DATA.colors).find(k => k.startsWith(g.book) || (g.book === 'Theory' && k === 'Electrical Theory') || (g.book === 'Calcs' && k.startsWith('Fundamental')) || (g.book === 'B&G' && k.startsWith('Bonding'))); }

  const f = document.getElementById('foot');
  f.appendChild($('h3', null, 'How a Friday runs'));
  const ul1 = $('ul'); DATA.footer.how.forEach(([t, x]) => ul1.appendChild($('li', null, '<b>' + t + '</b> ' + esc(x)))); f.appendChild(ul1);
  f.appendChild($('h3', null, 'The rules'));
  const ul2 = $('ul'); DATA.footer.rules.forEach(x => ul2.appendChild($('li', null, esc(x)))); f.appendChild(ul2);
  f.appendChild($('h3', null, 'Where this ends'));
  const ul3 = $('ul'); DATA.footer.ends.forEach(([t, x]) => ul3.appendChild($('li', null, '<b>' + esc(t) + '</b> — ' + esc(x)))); f.appendChild(ul3);
  f.appendChild($('p', 'sm', 'Passing score is 70%. We aim higher. · Generated ' + DATA.generated + ' from progress.md'));
})();
