<head>

<title>Path to Journeyman</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#111; --mute:#666; --line:#e3e5e8; --green:#1e7a3a; --green-bg:#dff5e4; --done:#e9ecef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 60px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  .brand { font-weight: 800; } .brand b { color:#2f6fd6; }
  .sub { color: var(--mute); margin: 2px 0 10px; font-size: .9rem; }
  .here-bar { position: sticky; top: 0; z-index: 5; background: var(--green); color:#fff; border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.15); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .here-bar small { display:block; font-weight: 400; opacity:.9; font-size:.8rem; }
  .here-bar button { background:#fff; color:var(--green); border:0; border-radius:8px; padding:8px 10px; font-weight:700; font-size:.85rem; flex:none; }
  .strip { background: var(--green-bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .strip h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; color:var(--green); }
  .chip { display:inline-block; background:#c3e6cc; color:#1e3f2a; border-radius: 999px; padding: 3px 10px; margin: 2px 4px 2px 0; font-size: .8rem; }
  .chip::before { content: "\2713  "; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; overflow: hidden; scroll-margin-top: 84px; }
  .card.here { border: 3px solid var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
  .card.isdone { background: var(--done); }
  .card.isdone .date, .card.isdone .head { text-decoration: line-through; color: var(--mute); }
  .card.off { background: #e9eaec; color:#777; }
  .top { display:flex; align-items:center; justify-content:space-between; padding: 6px 12px; color:#fff; font-size:.75rem; font-weight:700; letter-spacing:.04em; }
  .card.here .top .tag { background:#fff; color:var(--green); border-radius:6px; padding:1px 6px; }
  .summary { display:flex; align-items:center; gap:10px; padding: 10px 12px; cursor:pointer; user-select:none; }
  .summary .grow { flex:1; min-width:0; }
  .date { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
  .date .was { font-size:.75rem; font-weight:500; color:var(--mute); margin-left:6px; text-decoration: line-through; }
  .head { font-weight: 600; margin-top: 2px; }
  .brief { color: var(--mute); font-size:.85rem; margin-top: 2px; }
  .chev { color:#aaa; font-size: 1.4rem; transition: transform .15s; }
  .card.open .chev { transform: rotate(90deg); }
  .done-box { width: 26px; height: 26px; accent-color: var(--green); margin: 0; flex: none; }
  .body { display:none; padding: 0 12px 12px; border-top: 1px solid var(--line); }
  .card.open .body { display:block; }
  .group { margin: 10px 0 4px; }
  .group .gh { font-size: .75rem; color: var(--mute); text-transform: uppercase; letter-spacing:.04em; }
  .part { display:flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .part a.u { color:#1d4ed8; font-weight:600; text-decoration:none; flex: 1 1 auto; }
  .part .dur { color: var(--mute); font-size: .8rem; }
  .part .pick { background:#fff3c4; border-radius:4px; padding: 0 6px; font-size:.8rem; }
  .part .watch { background:#1d4ed8; color:#fff; border-radius:6px; padding:6px 10px; font-size:.8rem; font-weight:700; text-decoration:none; flex:none; }
  .quiz { margin-top: 10px; font-weight: 700; }
  .stop { color: var(--mute); font-size: .85rem; margin-top: 4px; }
  .qlinks { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .qlink { background:#fff3c4; color:#5a4500; border:1px solid #f2d97a; border-radius:8px; padding:6px 10px; font-size:.85rem; font-weight:700; text-decoration:none; }
  .qlink span { font-weight:400; color:#7a6a2a; }
  .actions { display:flex; gap:8px; margin-top: 12px; flex-wrap: wrap; }
  .actions button { flex:1; border:0; border-radius:8px; padding:10px; font-weight:700; font-size:.9rem; }
  .b-here { background: var(--green); color:#fff; } .b-here[disabled] { opacity:.5; }
  .b-reset { background:#e5e7eb; color:#333; }
  .banner { background:#222; color:#fff; text-align:center; font-weight:800; letter-spacing:.06em; padding: 5px; font-size:.8rem; }
  .exam .body p { margin: 4px 0; }
  footer { margin-top: 24px; font-size: .9rem; color: #333; }
  footer h3 { font-size: .8rem; text-transform: uppercase; letter-spacing:.05em; margin: 14px 0 6px; }
  footer ul { margin: 0; padding-left: 18px; }
  .sm { font-size:.8rem; color: var(--mute); }
</style>

      bh.addEventListener('click', e => { e.stopPropagation(); state.here = s.n; state.open[s.n] = true; save(); render(); document.getElementById('f' + s.n).scrollIntoView({behavior:'smooth', block:'start'}); });
      act.appendChild(bh);
      if (state.here) { const br = $('button', 'b-reset', 'Reset dates'); br.addEventListener('click', e => { e.stopPropagation(); state.here = null; save(); render(); }); act.appendChild(br); }
      b.appendChild(act);
      if (s.banner) c.appendChild($('div', 'banner', esc(s.banner)));
      cards.appendChild(c);
    });
  }
  document.getElementById('jump').addEventListener('click', () => {
    const n = currentN(); if (!n) return; state.open[n] = true; save(); render();
    document.getElementById('f' + n).scrollIntoView({behavior:'smooth', block:'start'});
  });
  render();
  document.getElementById('booksLink').href = DATA.books;

  const f = document.getElementById('foot');
  f.appendChild($('h3', null, 'How a Friday runs'));
  const ul1 = $('ul'); DATA.footer.how.forEach(([t, x]) => ul1.appendChild($('li', null, '<b>' + t + '</b> ' + esc(x)))); f.appendChild(ul1);
  f.appendChild($('h3', null, 'The rules'));
  const ul2 = $('ul'); DATA.footer.rules.forEach(x => ul2.appendChild($('li', null, esc(x)))); f.appendChild(ul2);
  f.appendChild($('h3', null, 'Where this ends'));
  const ul3 = $('ul'); DATA.footer.ends.forEach(([t, x]) => ul3.appendChild($('li', null, '<b>' + esc(t) + '</b> — ' + esc(x)))); f.appendChild(ul3);
  f.appendChild($('p', 'sm', "Passing score is 70%. We aim higher. · Done marks and We’re here are saved on this phone only. · Generated " + DATA.generated));
})();
</script>
