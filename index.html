<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Path to Journeyman</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#111; --mute:#666; --line:#e3e5e8; --green:#1e7a3a; --green-bg:#dff5e4; --done:#e9ecef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 60px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  .brand { font-weight: 800; } .brand b { color:#2f6fd6; }
  .sub { color: var(--mute); margin: 2px 0 10px; font-size: .9rem; }
  .here-bar { position: sticky; top: 0; z-index: 5; background: var(--green); color:#fff; border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.15); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .here-bar small { display:block; font-weight: 400; opacity:.9; font-size:.8rem; }
  .here-bar button { background:#fff; color:var(--green); border:0; border-radius:8px; padding:8px 10px; font-weight:700; font-size:.85rem; flex:none; }
  .strip { background: var(--green-bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .strip h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; color:var(--green); }
  .chip { display:inline-block; background:#c3e6cc; color:#1e3f2a; border-radius: 999px; padding: 3px 10px; margin: 2px 4px 2px 0; font-size: .8rem; }
  .chip::before { content: "\2713  "; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; overflow: hidden; scroll-margin-top: 84px; }
  .card.here { border: 3px solid var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
  .card.isdone { background: var(--done); }
  .card.isdone .date, .card.isdone .head { text-decoration: line-through; color: var(--mute); }
  .card.off { background: #e9eaec; color:#777; }
  .top { display:flex; align-items:center; justify-content:space-between; padding: 6px 12px; color:#fff; font-size:.75rem; font-weight:700; letter-spacing:.04em; }
  .card.here .top .tag { background:#fff; color:var(--green); border-radius:6px; padding:1px 6px; }
  .summary { display:flex; align-items:center; gap:10px; padding: 10px 12px; cursor:pointer; user-select:none; }
  .summary .grow { flex:1; min-width:0; }
  .date { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
  .date .was.late { color:#c0392b; }
  .date .was { font-size:.75rem; font-weight:500; color:var(--mute); margin-left:6px; text-decoration: line-through; }
  .head { font-weight: 600; margin-top: 2px; }
  .brief { color: var(--mute); font-size:.85rem; margin-top: 2px; }
  .chev { color:#aaa; font-size: 1.4rem; transition: transform .15s; }
  .card.open .chev { transform: rotate(90deg); }
  .done-box { flex:none; width:30px; height:30px; padding:0; border:2px solid #8a8f96; border-radius:6px; background:var(--card); color:#fff; font-size:20px; line-height:26px; font-weight:800; cursor:pointer; -webkit-appearance:none; appearance:none; }
  .done-box.on { background:var(--green); border-color:var(--green); }
  .done-box:focus-visible { outline: 3px solid var(--green-bg); }
  .body { display:none; padding: 0 12px 12px; border-top: 1px solid var(--line); }
  .card.open .body { display:block; }
  .group { margin: 10px 0 4px; }
  .group .gh { font-size: .75rem; color: var(--mute); text-transform: uppercase; letter-spacing:.04em; }
  .part { display:flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .part a.u { color:#1d4ed8; font-weight:600; text-decoration:none; flex: 1 1 auto; }
  .part .dur { color: var(--mute); font-size: .8rem; }
  .part .pick { background:#fff3c4; border-radius:4px; padding: 0 6px; font-size:.8rem; }
  .part .watch { background:#1d4ed8; color:#fff; border-radius:6px; padding:6px 10px; font-size:.8rem; font-weight:700; text-decoration:none; flex:none; }
  .quiz { margin-top: 10px; font-weight: 700; }
  .stop { color: var(--mute); font-size: .85rem; margin-top: 4px; }
  .qlinks { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .qlink { background:#fff3c4; color:#5a4500; border:1px solid #f2d97a; border-radius:8px; padding:6px 10px; font-size:.85rem; font-weight:700; text-decoration:none; }
  .qlink span { font-weight:400; color:#7a6a2a; }
  .actions { display:flex; gap:8px; margin-top: 12px; flex-wrap: wrap; }
  .actions button { flex:1; border:0; border-radius:8px; padding:10px; font-weight:700; font-size:.9rem; }
  .b-here { background: var(--green); color:#fff; } .b-here[disabled] { opacity:.5; }
  .b-reset { background:#e5e7eb; color:#333; }
  .banner { background:#222; color:#fff; text-align:center; font-weight:800; letter-spacing:.06em; padding: 5px; font-size:.8rem; }
  .exam .body p { margin: 4px 0; }
  footer { margin-top: 24px; font-size: .9rem; color: #333; }
  footer h3 { font-size: .8rem; text-transform: uppercase; letter-spacing:.05em; margin: 14px 0 6px; }
  footer ul { margin: 0; padding-left: 18px; }
  .sm { font-size:.8rem; color: var(--mute); }
  .who { display:flex; gap:8px; align-items:center; background:#fff7d6; border:1px solid #f0d78a; border-radius:10px; padding:10px 12px; margin:0 0 12px; }
  .who input { flex:1; min-width:0; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .who button { background:var(--green); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-weight:700; }
  .synced { color: var(--green); }
  .stopnote { display:flex; flex-direction:column; gap:4px; margin: 10px 0 0; }
  .stopnote label { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:700; }
  .stopnote input { font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); width:100%; }
  .stopnote .saved { font-size:.75rem; color:var(--mute); min-height:1em; }
  .brief .mynote { display:block; color:var(--ink); font-weight:600; margin-top:2px; }
  #check .summary .head { font-size:1rem; }
  .ck { padding: 4px 12px 10px; }
  .ck h4 { margin: 10px 0 4px; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
  .ck .row { display:flex; gap:8px; align-items:flex-start; padding: 5px 0; border-top: 1px solid var(--line); font-size:.9rem; }
  .ck .box { flex:none; width:20px; height:20px; border:2px solid #999; border-radius:4px; margin-top:1px; text-align:center; line-height:16px; font-weight:800; color:#fff; }
  .ck .box.on { background: var(--green); border-color: var(--green); }
  .ck .box.part { border-color: var(--green); color: var(--green); }
  .ck .nm { flex:1; min-width:0; }
  .ck .nm .on { text-decoration: line-through; color: var(--mute); }
  .ck .meta { font-size:.75rem; color: var(--mute); }
  .ck .gap { color:#c0392b; font-weight:700; }
</style>

      const isHere = s.n === cur, isDone = !!state.done[s.n];
      const isOpen = (s.n in state.open) ? !!state.open[s.n] : isHere;
      const c = $('div', 'card' + (isHere ? ' here' : '') + (isDone ? ' isdone' : '') + (isOpen ? ' open' : '') + (s.exam ? ' exam' : ''));
      c.id = 'f' + s.n;
      const color = s.exam ? DATA.colors.Exam : (s.groups && s.groups[0] ? DATA.colors[bookFull(s.groups[0].book)] : '#444');
      const top = $('div', 'top', '<span>' + (s.exam ? 'SIMULATED EXAM' : 'DAY ' + s.n + ' of ' + N) + (isHere ? ' <span class="tag">NEXT</span>' : '') + '</span><span>' + (s.exam ? 'exam' : mins(s.minutes)) + '</span>');
      top.style.background = color || '#444'; c.appendChild(top);

      const sum = $('div', 'summary');
      const cb = $('button', 'done-box' + (isDone ? ' on' : ''), isDone ? '✓' : ''); cb.type = 'button'; cb.id = 'done' + s.n;
      cb.setAttribute('role', 'checkbox'); cb.setAttribute('aria-checked', isDone ? 'true' : 'false'); cb.setAttribute('aria-label', 'Done');
      cb.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); if (state.done[s.n]) delete state.done[s.n]; else state.done[s.n] = true; save(); render(); });
      sum.appendChild(cb);
      const g = $('div', 'grow');
      const late = !isDone && D(s.date) < today;
      g.appendChild($('div', 'date', (s.exam ? 'Exam' : 'Day ' + s.n) + '<span class="was' + (late ? ' late' : '') + '">' + (late ? 'was due ' : 'by ') + dlab(s.date) + '</span>'));
      g.appendChild($('div', 'head', esc(s.exam || s.head)));
      const myNote = (state.notes && state.notes[s.n] || '').trim();
      g.appendChild($('div', 'brief', (s.exam ? '' : esc(s.quiz)) + (myNote ? '<span class="mynote">✎ ' + esc(myNote) + '</span>' : '')));
      sum.appendChild(g);
      sum.appendChild($('div', 'chev', '›'));
      sum.addEventListener('click', () => { state.open[s.n] = !isOpen; save(); render(); });
      c.appendChild(sum);

      const b = $('div', 'body'); c.appendChild(b);
      if (s.exam) {
        s.lines.forEach(l => b.appendChild($('p', null, esc(l))));
      } else {
        s.groups.forEach(gr => {
          const gd = $('div', 'group');
          gd.appendChild($('div', 'gh', esc(gr.book + (gr.chapter === 'intro' ? ' · Intro' : gr.chapter === 'summary' ? ' · Summary' : gr.book === 'Exam Prep' ? '' : ' · Ch ' + gr.chapter) + (gr.chapter_title ? ' ' + gr.chapter_title : '') + (gr.page ? ' (pg ' + gr.page + ')' : ''))));
          gr.parts.forEach(p => {
            const row = $('div', 'part');
            const a = $('a', 'u', esc(p.unit.label)); a.href = link(p.unit.id, p.t); a.target = '_blank'; a.rel = 'noopener';
            row.appendChild(a);
            row.appendChild($('span', 'dur', (p.unit.est ? 'about ' : '') + hms(p.unit.dur)));
            if (p.t) row.appendChild($('span', 'pick', 'pick up at ' + hms(p.t)));
            if (!p.complete) row.appendChild($('span', 'pick', 'stop at ' + hms(p.end)));
            const w = $('a', 'watch', 'Watch'); w.href = a.href; w.target = '_blank'; w.rel = 'noopener'; row.appendChild(w);
            gd.appendChild(row);
          });
          b.appendChild(gd);
        });
        if (s.note) b.appendChild($('div', 'sm', esc(s.note)));
        b.appendChild($('div', 'quiz', esc(s.quiz)));
        if (s.quiz_links && s.quiz_links.length) {
          const ql = $('div', 'qlinks');
          s.quiz_links.forEach(q => {
            const a = $('a', 'qlink', esc(q.label) + ' <span>' + esc(q.book) + ' book · pg ' + q.page + '</span>');
            a.href = q.url; a.target = '_blank'; a.rel = 'noopener'; ql.appendChild(a);
          });
          ql.appendChild($('div', 'sm', 'Opens the digital book in your Mike Holt account (login). Type the page number into the viewer’s page box.'));
          b.appendChild(ql);
        }
        if (s.stop) b.appendChild($('div', 'stop', 'The next day starts at ' + esc(s.stop.unit.book + ': ' + s.stop.unit.label) + (s.stop.at ? ' @ ' + hms(s.stop.at) : '')));
      }
      const sn = $('div', 'stopnote');
      const lab = $('label', null, 'Where I stopped / notes'); lab.htmlFor = 'note' + s.n; sn.appendChild(lab);
      const inp = $('input'); inp.id = 'note' + s.n; inp.type = 'text'; inp.autocomplete = 'off'; inp.placeholder = s.exam ? 'Score, what to rewatch' : 'e.g. Unit 25 @ 41:10, redo the quiz'; inp.value = myNote;
      const savedWord = $('div', 'saved', '');
      let noteTimer = null;
      inp.addEventListener('input', () => { state.notes[s.n] = inp.value; clearTimeout(noteTimer); noteTimer = setTimeout(() => { save(); savedWord.textContent = 'Saved'; const b = c.querySelector('.brief'); if (b) b.innerHTML = (s.exam ? '' : esc(s.quiz)) + (inp.value.trim() ? '<span class="mynote">✎ ' + esc(inp.value.trim()) + '</span>' : ''); }, 400); });
      inp.addEventListener('click', e => e.stopPropagation());
      sn.appendChild(inp); sn.appendChild(savedWord); b.appendChild(sn);
      const act = $('div', 'actions');
      const bd = $('button', 'b-here', isDone ? 'Mark not done' : 'Mark done');
      bd.addEventListener('click', e => { e.stopPropagation(); if (isDone) delete state.done[s.n]; else state.done[s.n] = true; save(); render(); });
      act.appendChild(bd);
      b.appendChild(act);
      if (s.banner) c.appendChild($('div', 'banner', esc(s.banner)));
      cards.appendChild(c);
    });
  }
  document.getElementById('jump').addEventListener('click', () => {
    const n = currentN(); if (!n) return; state.open[n] = true; save(); render();
    document.getElementById('f' + n).scrollIntoView({behavior:'smooth', block:'start'});
  });
  render();
  document.getElementById('booksLink').href = DATA.books;

  const f = document.getElementById('foot');
  f.appendChild($('h3', null, 'How a day runs'));
  const ul1 = $('ul'); DATA.footer.how.forEach(([t, x]) => ul1.appendChild($('li', null, '<b>' + esc(t) + '</b> ' + esc(x)))); f.appendChild(ul1);
  f.appendChild($('h3', null, 'The rules'));
  const ul2 = $('ul'); DATA.footer.rules.forEach(x => ul2.appendChild($('li', null, esc(x)))); f.appendChild(ul2);
  f.appendChild($('h3', null, 'Where this ends'));
  const ul3 = $('ul'); DATA.footer.ends.forEach(([t, x]) => ul3.appendChild($('li', null, '<b>' + esc(t) + '</b> — ' + esc(x)))); f.appendChild(ul3);
  f.appendChild($('p', 'sm', "Passing score is 70%. We aim higher. · Generated " + DATA.generated));
  const sw = $('p', 'sm'); sw.appendChild($('span', null, '')); sw.lastChild.id = 'syncWord';
  if (SYNC.key) { const a = $('a', null, who ? ' · Not ' + esc(who) + '? Switch' : ' · Give a name'); a.href = '#';
    a.addEventListener('click', e => { e.preventDefault(); who = null; try { localStorage.removeItem(WHO); } catch (x) {} whoCard.hidden = false; document.getElementById('whoName').focus(); paintSync(); window.scrollTo({top:0, behavior:'smooth'}); });
    sw.appendChild(a); }
  f.appendChild(sw); paintSync();
  pull();
})();
</script>
</body>
</html>
